[project]
name = "proteinmpnn-cli"
version = "0.2.0"
description = "Structure-conditioned protein sequence design using message passing neural networks"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Miguel González Duque", email = "miguelgondu@gmail.com" }
]
keywords = ["protein", "sequence-design", "deep-learning", "structural-biology", "bioinformatics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
requires-python = ">=3.13"
dependencies = [
    "biopython>=1.87",
    "numpy>=2.4.6",
    "pydantic>=2.13.4",
    "rich>=14.0.0",
    "torch>=2.12.0",
    "typer>=0.26.3",
]

[project.urls]
Homepage = "https://github.com/miguelgondu/ProteinMPNN"
Repository = "https://github.com/miguelgondu/ProteinMPNN"
Issues = "https://github.com/miguelgondu/ProteinMPNN/issues"
Changelog = "https://github.com/miguelgondu/ProteinMPNN/blob/main/CHANGELOG.md"

[project.scripts]
proteinmpnn = "proteinmpnn:main"

[dependency-groups]
dev = [
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proteinmpnn"]

[tool.hatch.build.targets.sdist]
exclude = ["run/model_weights", "examples"]

[tool.ruff]
exclude = ["run", "examples", "setup", "data", "scripts"]

[tool.ruff.lint]
extend-select = [
    "F",        # Pyflakes rules
    "W",        # PyCodeStyle warnings
    "E",        # PyCodeStyle errors
    "I",        # Sort imports properly
    "UP",       # Warn if certain things can changed due to newer Python versions
    "C4",       # Catch incorrect use of comprehensions, dict, list, etc
    "FA",       # Enforce from __future__ import annotations
    "ISC",      # Good use of string concatenation
    "ICN",      # Use common import conventions
    "RET",      # Good return practices
    "SIM",      # Common simplification rules
    "TID",      # Some good import practices
    "TC",       # Enforce importing certain types in a TYPE_CHECKING block
    "PTH",      # Use pathlib instead of os.path
    "NPY",      # Some numpy-specific things
]
ignore = [
    "E741", # Do not use variables named 'l', 'O', or 'I'
]
